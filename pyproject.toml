[project]
name = "solar-eclipse-toolkit"
version = "0.9.0"
authors = [
    { name = "Samuli Vuorinen", email = "samuli.vuorinen@iki.fi" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
]
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE.md']
requires-python = ">=3.10"
dependencies = [
    "rawpy ~= 0.25.0",
    "matplotlib ~= 3.10.3",
    "numpy ~= 2.2.6",
    "opencv-python-headless ~= 4.11.0",
    "joblib ~= 1.5.1",
    "click ~= 8.1.7",
    "tifffile ~= 2025.6.11",
    "tqdm ~= 4.67.1",
    "scipy ~= 1.15.2",
    "scikit-learn ~= 1.7.0",
    "black ~= 25.1.0",
    "numba ~= 0.61.2",
    "numba-progress ~= 1.1.0",
    "scikit-image ~= 0.25.2",
]

[dependency-groups]
test = [
    "pytest ~= 8.4.0",
    "pytest-xdist ~= 3.7.0",
]

[project.urls]
Homepage = "https://github.com/naavis/eclipsetools/"
Repository = "https://github.com/naavis/eclipsetools/"

[project.scripts]
eclipsetools = "eclipsetools.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"